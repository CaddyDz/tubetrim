<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TubeTrim</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1 class="wordmark">Tube<span>Trim</span></h1>
      <p class="tagline">Paste a YouTube link, keep just the audio you need.</p>
    </header>

    <section>
      <label class="field-label" for="url">YouTube URL or video ID</label>
      <input id="url" type="text" autofocus autocomplete="off" spellcheck="false"
             placeholder="https://www.youtube.com/watch?v=…">
      <p id="info-loading" class="loading" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>Fetching video info&hellip;
      </p>
      <p id="url-error" class="error" role="alert"></p>
    </section>

    <section id="card" class="card" hidden>
      <div class="video">
        <img id="thumb" alt="" hidden>
        <div class="video-meta">
          <h2 id="video-title"></h2>
          <p id="video-sub" class="muted"></p>
        </div>
      </div>

      <div class="controls">
        <div class="field">
          <label class="field-label" for="start">Start</label>
          <input id="start" class="time" type="text" placeholder="0:00" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="end">End</label>
          <input id="end" class="time" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="format">Format</label>
          <select id="format">
            <option value="mp3" selected>mp3</option>
            <option value="m4a">m4a</option>
            <option value="wav">wav</option>
          </select>
        </div>
        <button id="convert" class="btn" type="button">Convert</button>
      </div>
      <p id="job-error" class="error" role="alert"></p>

      <div id="progress" class="progress" hidden>
        <div class="track"><div id="progress-fill" class="fill"></div></div>
        <p class="status"><span id="status-label"></span><span id="status-pct" class="pct"></span></p>
      </div>

      <p id="download" hidden><a id="download-link" class="btn" href="#" download>Download</a></p>
    </section>
  </main>

  <footer>yt-dlp + ffmpeg &middot; personal use</footer>
</body>
</html>
